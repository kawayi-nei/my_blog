# My Blog nginx 配置（当前阶段：只有公网 IP，没有域名，使用 HTTP）
#
# 安装位置：
#   /etc/nginx/sites-available/myblog
# 启用：
#   sudo ln -s /etc/nginx/sites-available/myblog /etc/nginx/sites-enabled/myblog
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 重要：HTTP 下管理员登录凭据会明文经过网络。这个配置只适合临时上线；
# 拿到域名后请按 deploy/README.md 的「切换到 HTTPS」章节升级。
#
# limit_req_zone 必须位于 http 上下文；本文件会被 nginx.conf 的
# include /etc/nginx/sites-enabled/*; 包含，因此写在 server 块外是合法的。
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name 123.206.100.36;

    # 上传接口后端限制 5 MB；这里留 1 MB 余量给 multipart 头部。
    client_max_body_size 6m;

    # 基础安全响应头。没有 HTTPS 时不要加 HSTS。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 登录接口在 nginx 层再限流一次：
    # 每 IP 每分钟 10 次，burst 5；应用层还有 5 次/15 分钟的进程内限制。
    location = /api/auth/login {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 所有业务 API 交给 FastAPI。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件由 nginx 直接读取磁盘，不经过 FastAPI，节省 Python 进程开销。
    # 末尾两个斜杠都必须保留：/uploads/ 对应目录 /srv/my_blog/backend/uploads/。
    location /uploads/ {
        alias /srv/my_blog/backend/uploads/;
        expires 30d;
        access_log off;
    }

    # 其余请求交给 Next.js。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
